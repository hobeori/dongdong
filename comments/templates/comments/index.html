<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>댓글 증강 시스템</title>
  <style>
    :root {
      --blue-900: #1e3a8a; --blue-700: #1d4ed8; --blue-600: #2563eb; --blue-500: #3b82f6;
      --blue-200: #bfdbfe; --blue-100: #dbeafe; --blue-50: #eff6ff;
      --text: #0f172a; --muted: #64748b; --line: #e2e8f0; --bg: #f5f8ff; --card: #ffffff;
      --warn-bg: #fffbeb; --warn-line: #fde68a; --warn-text: #92400e;
      --err-bg: #fef2f2; --err-line: #fecaca; --err-text: #b91c1c;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font-family: -apple-system, "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; line-height: 1.5; }
    main { max-width: 960px; margin: 0 auto; padding: 32px 16px 72px; }

    header { text-align: center; margin-bottom: 24px; }
    header h1 { margin: 0; font-size: 1.75rem; color: var(--blue-700); letter-spacing: -.02em; }
    header p { margin: 6px 0 0; color: var(--muted); font-size: .95rem; }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
            padding: 20px; box-shadow: 0 1px 2px rgba(15, 23, 42, .04); }
    form { display: flex; gap: 8px; }
    form input[type=text] { flex: 1; min-width: 0; padding: 12px 14px; font-size: 1rem; border: 1px solid var(--line);
                            border-radius: 10px; background: #fff; color: var(--text); }
    form input[type=text]:focus { outline: 2px solid var(--blue-500); outline-offset: 1px; border-color: var(--blue-500); }
    button.primary { padding: 12px 22px; font-size: 1rem; font-weight: 600; color: #fff; background: var(--blue-600);
                     border: 0; border-radius: 10px; cursor: pointer; }
    button.primary:hover { background: var(--blue-700); }
    button.primary:disabled { background: var(--blue-200); cursor: wait; }
    .hint { margin: 10px 2px 0; font-size: .85rem; color: var(--muted); }

    /* 진행 단계 */
    .progress { margin-top: 18px; }
    .progress[hidden] { display: none; }
    .steps { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px; }
    .steps li { flex: 1; min-width: 0; text-align: center; font-size: .8rem; color: var(--muted); }
    .steps li::before { content: ""; display: block; height: 6px; border-radius: 99px; background: var(--line); margin-bottom: 8px; }
    .steps li.done { color: var(--blue-700); }
    .steps li.done::before { background: var(--blue-600); }
    .steps li.active { color: var(--blue-700); font-weight: 600; }
    .steps li.active::before { background: linear-gradient(90deg, var(--blue-600), var(--blue-200), var(--blue-600));
                               background-size: 200% 100%; animation: flow 1.2s linear infinite; }
    .steps li.error { color: var(--err-text); font-weight: 600; }
    .steps li.error::before { background: var(--err-text); }
    .progress-msg { margin: 12px 0 0; text-align: center; font-size: .9rem; color: var(--blue-900); }
    @keyframes flow { to { background-position: -200% 0; } }
    @media (prefers-reduced-motion: reduce) { .steps li.active::before { animation: none; background: var(--blue-500); } }

    /* 알림 */
    .notice { margin-top: 14px; padding: 11px 14px; border-radius: 10px; font-size: .9rem; border: 1px solid; }
    .notice.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-text); }
    .notice.error { background: var(--err-bg); border-color: var(--err-line); color: var(--err-text); }

    /* 결과 */
    .results { margin-top: 28px; }
    .results-title { margin: 0 0 14px; font-size: 1.25rem; color: var(--blue-900); }
    .results-title span { font-weight: 400; color: var(--muted); font-size: 1rem; }
    .summary { background: var(--blue-50); border: 1px solid var(--blue-100); border-radius: var(--radius);
               padding: 16px 18px; margin: 14px 0 20px; }
    .summary h3 { margin: 0 0 6px; font-size: .95rem; color: var(--blue-700); }
    .summary p { margin: 0; }

    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
    .tab { appearance: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 16px;
           font-size: .95rem; color: var(--muted); cursor: pointer; white-space: nowrap; margin-bottom: -1px; }
    .tab b { margin-left: 4px; padding: 1px 8px; border-radius: 99px; background: var(--line); color: var(--muted);
             font-size: .78rem; font-weight: 600; }
    .tab:hover { color: var(--blue-700); }
    .tab.active { color: var(--blue-700); border-bottom-color: var(--blue-600); font-weight: 600; }
    .tab.active b { background: var(--blue-600); color: #fff; }
    .tab:focus-visible { outline: 2px solid var(--blue-500); outline-offset: -2px; border-radius: 6px; }

    .panel { background: var(--card); border: 1px solid var(--line); border-top: 0;
             border-radius: 0 0 var(--radius) var(--radius); padding: 16px 18px 8px; }
    .panel[hidden] { display: none; }
    .panel-note { margin: 0 0 10px; font-size: .88rem; color: var(--muted); }
    .panel-note strong { color: var(--blue-700); }
    .comments { margin: 0; padding: 0; list-style: none; counter-reset: c; }
    .comments li { counter-increment: c; display: flex; gap: 10px; align-items: baseline; padding: 10px 0;
                   border-top: 1px solid var(--line); overflow-wrap: anywhere; }
    .comments li::before { content: counter(c); flex: none; width: 1.6em; text-align: right; font-size: .8rem; color: var(--blue-500); }
    .comments .text { flex: 1; }
    .comments li.removed { opacity: .45; }
    .comments li.removed .text { text-decoration: line-through; text-decoration-color: var(--blue-200); }
    .comments li.empty { color: var(--muted); }
    .comments li.empty::before { content: none; }
    .badge { flex: none; font-size: .72rem; padding: 2px 8px; border-radius: 99px; background: var(--blue-100); color: var(--blue-700); }
    .badge.soft { background: var(--line); color: var(--muted); }

    @media (max-width: 560px) {
      form { flex-direction: column; }
      .steps li { font-size: .7rem; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>댓글 증강 시스템</h1>
    <p>토스증권 커뮤니티 댓글을 수집하고, 정제하고, 증강합니다.</p>
  </header>

  <div class="card">
    <form id="search-form" method="get" action="{% url 'comments:company' %}">
      <input type="text" id="company_name" name="company_name" placeholder="회사 이름 (예: 삼성전자)"
             value="{{ company_name|default:'' }}" autocomplete="off" aria-label="회사 이름">
      <button type="submit" class="primary" id="submit-btn">검색</button>
    </form>
    <p class="hint">회사명 일부만 입력해도 됩니다. 가장 상단의 검색 결과를 자동으로 선택합니다.</p>

    <div class="progress" id="progress" hidden aria-live="polite">
      <ol class="steps" id="steps">
        <li data-step="search">검색</li>
        <li data-step="collect">수집</li>
        <li data-step="clean">전처리</li>
        <li data-step="augment">증강</li>
        <li data-step="summarize">요약</li>
      </ol>
      <p class="progress-msg" id="progress-msg"></p>
    </div>

    <div id="notice">{% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}</div>
  </div>

  <div id="results">{% if analysis %}{% include "comments/_results.html" %}{% endif %}</div>
</main>

<script>
  // 크롤링 진행 단계를 스트리밍으로 받아 표시한다. JS가 없으면 일반 폼 제출로 동작한다.
  const form = document.getElementById('search-form');
  const noticeBox = document.getElementById('notice');
  const results = document.getElementById('results');
  const btn = document.getElementById('submit-btn');
  const progress = document.getElementById('progress');
  const progressMsg = document.getElementById('progress-msg');
  const steps = [...document.querySelectorAll('#steps li')];

  function setStep(stepId, message) {
    const idx = steps.findIndex(li => li.dataset.step === stepId);
    steps.forEach((li, i) => {
      li.className = i < idx ? 'done' : i === idx ? 'active' : '';
    });
    progressMsg.textContent = message || '';
  }
  function finishSteps() { steps.forEach(li => li.className = 'done'); progressMsg.textContent = '완료되었습니다.'; }
  function failStep(message) {
    const active = steps.find(li => li.classList.contains('active')) || steps[0];
    active.className = 'error';
    progressMsg.textContent = '';
    showNotice('error', message);
  }
  function showNotice(kind, text) {
    noticeBox.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'notice ' + kind;
    if (kind === 'error') div.setAttribute('role', 'alert');
    div.textContent = text;
    noticeBox.appendChild(div);
  }

  form.addEventListener('submit', async (e) => {
    const name = form.company_name.value.trim();
    if (!name) { e.preventDefault(); return; }  // 입력값이 없으면 아무 동작도 하지 않는다
    if (!window.fetch || !window.TextDecoder) return;
    e.preventDefault();
    btn.disabled = true;
    results.innerHTML = '';
    noticeBox.innerHTML = '';
    progress.hidden = false;
    setStep('search', '시작하는 중...');
    try {
      const resp = await fetch('{% url "comments:company_stream" %}?company_name=' + encodeURIComponent(name));
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = '', finished = false;
      const handle = (line) => {
        if (!line.trim()) return;
        const ev = JSON.parse(line);
        if (ev.type === 'progress') setStep(ev.step, ev.message);
        else if (ev.type === 'error') { failStep(ev.message); finished = true; }
        else if (ev.type === 'result') { finishSteps(); results.innerHTML = ev.html; finished = true; }
      };
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();
        lines.forEach(handle);
      }
      handle(buf);
      if (!finished) failStep('처리 중 오류가 발생했습니다.');
    } catch (err) {
      failStep('서버와 통신하지 못했습니다.');
    } finally {
      btn.disabled = false;
    }
  });

  // 결과 탭 전환 (결과가 동적으로 삽입되므로 이벤트 위임을 사용한다)
  document.addEventListener('click', (e) => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    const root = tab.closest('.results');
    root.querySelectorAll('.tab').forEach(t => {
      const on = t === tab;
      t.classList.toggle('active', on);
      t.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    root.querySelectorAll('.panel').forEach(p => { p.hidden = p.dataset.panel !== tab.dataset.tab; });
  });
</script>
</body>
</html>
